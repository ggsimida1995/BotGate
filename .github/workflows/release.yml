name: Release Bot Gate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="BotGate-${version}-linux-x64"
          mkdir -p "$dir/frontend"
          cp backend/target/release/bot-gate "$dir/"
          cp backend/config.example.toml "$dir/config.toml"
          cp -R frontend/dist "$dir/frontend/"
          cp LICENSE README.md "$dir/"
          test -f "$dir/config.toml"
          test -f "$dir/frontend/dist/admin.html"
          test -f "$dir/frontend/dist/challenge.html"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BotGate-*.tar.gz
            BotGate-*.tar.gz.sha256

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build backend
        working-directory: backend
        run: cargo build --release --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          rm -rf desktop/resources
          mkdir -p desktop/resources/frontend
          cp backend/target/release/bot-gate desktop/resources/bot-gate-backend
          cp backend/config.example.toml desktop/resources/config.toml
          cp -R frontend/dist desktop/resources/frontend/
          test -f desktop/resources/config.toml
          test -f desktop/resources/frontend/dist/admin.html
          test -f desktop/resources/frontend/dist/challenge.html
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" desktop/tauri.conf.json
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$version\"/" desktop/Cargo.toml
          (cd desktop && cargo tauri build --ci --bundles app)
          app=$(find desktop/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          hdiutil create -volname "网站卫士" -srcfolder "$app" -ov -format UDZO "BotGate-${version}-macos-arm64.dmg"
          shasum -a 256 "BotGate-${version}-macos-arm64.dmg" > "BotGate-${version}-macos-arm64.dmg.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BotGate-*.dmg
            BotGate-*.dmg.sha256

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: npm ci; npm run build
      - name: Build backend
        working-directory: backend
        shell: pwsh
        run: cargo build --release --locked
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if (Test-Path desktop/resources) { Remove-Item desktop/resources -Recurse -Force }
          New-Item -ItemType Directory -Force desktop/resources/frontend | Out-Null
          Copy-Item backend/target/release/bot-gate.exe desktop/resources/bot-gate-backend.exe
          Copy-Item backend/config.example.toml desktop/resources/config.toml
          Copy-Item frontend/dist desktop/resources/frontend/ -Recurse
          if (-not (Test-Path desktop/resources/config.toml)) { throw "config.toml missing from bundle" }
          if (-not (Test-Path desktop/resources/frontend/dist/admin.html)) { throw "admin.html missing from bundle" }
          if (-not (Test-Path desktop/resources/frontend/dist/challenge.html)) { throw "challenge.html missing from bundle" }
          $config = Get-Content desktop/tauri.conf.json -Raw
          $config = [regex]::Replace($config, '"version": "[^"]*"', ('"version": "' + $version + '"'), 1)
          Set-Content desktop/tauri.conf.json $config -NoNewline
          $desktopCargo = Get-Content desktop/Cargo.toml -Raw
          $desktopCargo = [regex]::Replace($desktopCargo, '(?m)^version = "[^"]*"', ('version = "' + $version + '"'), 1)
          Set-Content desktop/Cargo.toml $desktopCargo -NoNewline
          Push-Location desktop
          cargo tauri build --ci --bundles nsis
          Pop-Location
          $installer = Get-ChildItem desktop/target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Tauri installer was not created" }
          Copy-Item $installer.FullName "BotGate-$version-windows-x64-setup.exe"
          $hash = (Get-FileHash "BotGate-$version-windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  BotGate-$version-windows-x64-setup.exe" | Set-Content "BotGate-$version-windows-x64-setup.exe.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BotGate-*-setup.exe
            BotGate-*-setup.exe.sha256
