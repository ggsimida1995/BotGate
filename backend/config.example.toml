# Current baseline configuration: HTTP reverse proxy, browser verification,
# rate limiting, scanner detection and SQLite persistence.
# Set [admin] below to enable the loopback-only management UI.

[server]
# The Bot Gate front proxy starts automatically with the process.
# If this port is occupied, Bot Gate fails instead of silently moving the public entry point.
# For production front-proxy mode, use a public listener such as
# 0.0.0.0:18081, and bind the source service only to an internal port.
listen = "127.0.0.1:8080"
request_timeout_secs = 30
max_header_bytes = 65536
max_body_size = 104857600

# Optional HTTPS listener. Keep disabled until you have a certificate and key.
[tls]
enabled = false
listen = "127.0.0.1:8443"
cert_file = "data/tls/cert.pem"
key_file = "data/tls/key.pem"
# Redirect recognized configured hosts from [server] to this listener.
redirect_http = false

[verification]
enabled = true
cookie_name = "bot_verified"
cookie_ttl = "30m"
challenge_ttl = "60s"
max_attempts = 5
pow_difficulty = 4
bind_ip = true
secret_file = "data/secret.key"

[security.rate_limit]
enabled = true
requests_per_second = 10.0
burst = 20
skip_whitelist = false

[security.scanner_detection]
enabled = true
max_404_per_minute = 30
max_distinct_paths_per_minute = 60
risk_limit_threshold = 50
risk_challenge_threshold = 70
risk_ban_threshold = 90
sensitive_paths = ["/.env", "/.git/", "/wp-admin", "/phpmyadmin", "/admin", "/actuator", "/swagger", "/swagger-ui", "/api-docs", "/backup", "/config", "/test"]

[security.ban]
enabled = true
duration = "10m"

[security.whitelist]
ips = ["127.0.0.1"]
networks = []
# Retained for policy compatibility; signed browser verification is still required.
skip_challenge = true
skip_rate_limit = false

[storage]
enabled = true
database = "data/bot-gate.db"
log_retention = "7d"
persist_request_logs = true

# This listener starts with the process and remains available while the front proxy is stopped.
# Keep it on a loopback address.
[admin]
enabled = true
listen = "127.0.0.1:9090"

# GitHub Release link shown in the management dashboard.
[update]
enabled = true
release_url = "https://api.github.com/repos/ggsimida1995/BotGate/releases/latest"

# Optional signed one-year license verification.
# The public key is base64/base64url-encoded Ed25519 public key bytes.
[license]
enabled = false
public_key = ""
file = "data/license.key"

# Nginx inline adapter. Paths are environment-specific and must not be hardcoded
# in the app bundle. When vhost_dir is empty, Bot Gate runs `nginx -T` and
# discovers the files that the active Nginx actually loaded.
# binary = "nginx" uses PATH; set an absolute path only when Nginx is not in PATH.
# config_file = "" uses Nginx's compiled/default config; set it for `nginx -c`.
# include_dir is resolved relative to this config file.
[nginx]
# The adapter is safe to enable without changing Nginx; it only writes a vhost
# after an nginx-mode site is explicitly saved from the dashboard.
enabled = true
vhost_dir = ""
config_file = ""
binary = "nginx"
include_dir = "data/nginx"

[upstream]
# Local/private upstreams are allowed by default for self-hosted projects.
# Runtime DNS resolution still rejects public addresses.
allow_loopback = true
allow_private_networks = true
# Domain upstreams are resolved per request and accepted only when they resolve
# to an allowed loopback/private address.
allow_dns = true

# Optional initial routes. Proxy mode routes through Bot Gate to an internal HTTP source.
# Nginx mode leaves the source vhost in place and injects an inline auth include automatically.
# [[sites]]
# host = "example.com"
# mode = "nginx"
# policy = "normal"
# enabled = true
#
# [[sites]]
# host = "dev.example.com"
# mode = "proxy"
# target = "http://127.0.0.1:3000"
# policy = "normal"
# enabled = true
